name: iOS CI/CD

on:
  pull_request:
    branches: [main, test/ios-strict-quality-gates]
  push:
    branches: [main, test/ios-strict-quality-gates]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-build-and-test:
    name: CI Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd WCS-Platform && xcodegen generate

      - name: Validate activated support contacts
        run: bash scripts/validate-support-contacts.sh

      - name: Validate external link allowlist config
        run: bash scripts/validate-external-links-config.sh

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          prefs=['iPhone 17 Pro Max','iPhone 17 Pro','iPhone 17','iPhone 16 Pro']
          for name in prefs:
            for runtime,devs in data.get('devices',{}).items():
              if 'iOS' not in runtime and 'iphone' not in runtime.lower():
                continue
              for d in devs:
                if d.get('name')==name and d.get('isAvailable'):
                  print(name); raise SystemExit
          for runtime,devs in data.get('devices',{}).items():
            if 'iOS' not in runtime:
              continue
            for d in devs:
              if d.get('name','').startswith('iPhone') and d.get('isAvailable'):
                print(d['name']); raise SystemExit
          raise SystemExit('No iPhone simulator found')
          ")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build for simulator
        run: >
          xcodebuild
          -project "WCS-Platform/WCS-Platform.xcodeproj"
          -scheme "WCS-Platform"
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"
          -sdk iphonesimulator
          -parallel-testing-enabled NO
          build

      - name: Run production unit and integration tests
        env:
          CI: "true"
          WCS_STRICT_REMOTE_VIDEO_TESTS: "1"
        run: >
          xcodebuild
          -project "WCS-Platform/WCS-Platform.xcodeproj"
          -scheme "WCS-Platform"
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"
          -sdk iphonesimulator
          -enableCodeCoverage YES
          -parallel-testing-enabled NO
          -only-testing:WCS-PlatformTests
          test

      - name: Run UI smoke tests
        env:
          CI: "true"
        run: >
          xcodebuild
          -project "WCS-Platform/WCS-Platform.xcodeproj"
          -scheme "WCS-Platform"
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"
          -sdk iphonesimulator
          -parallel-testing-enabled NO
          -only-testing:WCS-PlatformUITests/Smoke
          -only-testing:WCS-PlatformUITests/ReviewFlows
          -only-testing:WCS-PlatformUITests/Recovery
          test

      - name: Run full UI E2E gates
        env:
          CI: "true"
        run: >
          xcodebuild
          -project "WCS-Platform/WCS-Platform.xcodeproj"
          -scheme "WCS-Platform"
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"
          -sdk iphonesimulator
          -parallel-testing-enabled NO
          -only-testing:WCS-PlatformUITests/E2E
          test

      - name: Verify privacy manifest exists
        run: test -f "WCS-Platform/PrivacyInfo.xcprivacy"

  cd-archive-artifact:
    name: CD Archive Artifact
    runs-on: macos-15
    needs: ci-build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd WCS-Platform && xcodegen generate

      - name: Create unsigned archive
        run: >
          xcodebuild
          -project "WCS-Platform/WCS-Platform.xcodeproj"
          -scheme "WCS-Platform"
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/WCS-Platform.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: WCS-Platform-iOS-xcarchive
          path: ${{ runner.temp }}/WCS-Platform.xcarchive
          if-no-files-found: error
